      - name: Create deployment bundle
        run: |
          tar czf confidential_site_bundle_${{ github.run_id }}.tgz \
            site-node infra

      - name: Copy bundle to site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "confidential_site_bundle_${{ github.run_id }}.tgz"
          target: "/tmp"

      - name: Deploy on site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: OPENAI_API_KEY
          script: |
            BUNDLE="/tmp/confidential_site_bundle_${{ github.run_id }}.tgz"
            tar -xzf $BUNDLE -C /tmp infra/scripts/deploy_site.sh
            bash /tmp/infra/scripts/deploy_site.sh $BUNDLE
            rm $BUNDLE # Clean up after success