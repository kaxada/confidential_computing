name: Deploy Site Node

on:
  push:
    paths:
      - "site-node/**"
      - "infra/**"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: confidential_computing
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment bundle
        run: |
          tar czf confidential_site_bundle.tgz \
            site-node infra

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          # Create the directory if it doesn't exist, then remove the old file
          script: |
            mkdir -p ~/deployments
            rm -f ~/deployments/confidential_site_bundle.tgz

      - name: Copy bundle to site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "confidential_site_bundle.tgz"
          target: "~/deployments"
          debug: true

      - name: Deploy on site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: OPENAI_API_KEY
          script: |
            # Extract from the new location
            tar -xzf ~/deployments/confidential_site_bundle.tgz -C /tmp infra/scripts/deploy_site.sh
            bash /tmp/infra/scripts/deploy_site.sh ~/deployments/confidential_site_bundle.tgz