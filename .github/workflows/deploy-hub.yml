name: Deploy Hub (backend + frontend)

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/deploy-hub.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: confidential_computing
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment bundle
        run: |
          tar czf confidential_bundle.tgz \
            backend frontend infra

      - name: Copy bundle to hub
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HUB_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "confidential_bundle.tgz"
          target: "/tmp"

      - name: Deploy on hub
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SITE_1_URL: "http://${{ secrets.SITE_1_HOST }}:8000"
          SITE_2_URL: "http://${{ secrets.SITE_2_HOST }}:8000"
          SITE_3_URL: "http://${{ secrets.SITE_3_HOST }}:8000"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HUB_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SECRET,SITE_1_URL,SITE_2_URL,SITE_3_URL
          script: |
            tar -xzf /tmp/confidential_bundle.tgz -C /tmp infra/scripts/deploy_hub.sh
            bash /tmp/infra/scripts/deploy_hub.sh /tmp/confidential_bundle.tgz
            rm -f /tmp/confidential_bundle.tgz
            rm -rf /tmp/infra
