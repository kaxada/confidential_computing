name: Deploy Site Node

on:
  push:
    paths:
      - "site-node/**"
      - "infra/**"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: confidential_computing
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment bundle
        run: |
          # Create bundle in current workspace so scp-action can see it
          tar czf confidential_site_bundle.tgz \
            site-node infra

      - name: Copy bundle to site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "confidential_site_bundle.tgz"
          target: "/tmp"

      - name: Deploy on site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            bash /opt/confidential/infra/scripts/deploy_site.sh /tmp/confidential_site_bundle.tgz