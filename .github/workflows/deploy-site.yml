name: Deploy Site Node

on:
  push:
    paths:
      - "site-node/**"
      - "infra/**"
      - ".github/workflows/deploy-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: confidential_computing
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment bundle
        run: |
          tar czf confidential_site_bundle.tgz \
            site-node infra

      - name: Prep remote temp dir (avoid $HOME disk issues)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /var/tmp/confidential_deploy
            sudo rm -f /var/tmp/confidential_deploy/confidential_site_bundle.tgz
            df -h /var/tmp || true

      - name: Copy bundle to site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "confidential_site_bundle.tgz"
          target: "/var/tmp/confidential_deploy"
          debug: true

      - name: Deploy on site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SITE_HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: OPENAI_API_KEY
          script: |
            tar -xzf /var/tmp/confidential_deploy/confidential_site_bundle.tgz -C /tmp infra/scripts/deploy_site.sh
            bash /tmp/infra/scripts/deploy_site.sh /var/tmp/confidential_deploy/confidential_site_bundle.tgz
